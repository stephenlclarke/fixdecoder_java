---
# yamllint disable rule:truthy rule:line-length
name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Lint workflow YAML
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install yamllint
          yamllint .github/workflows
      - name: Ensure FIX dictionaries
        run: bash -lc 'source ci/ci_helper.sh && download_fix_specs'
      - name: Verify
        run: ./mvnw -B verify
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: error

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'))
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: jacoco-report
          path: target/site/jacoco
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./mvnw -B -DskipTests compile org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=stephenlclarke \
            -Dsonar.projectKey=stephenlclarke_fixdecoder_java 2>&1 | tee target/sonarcloud.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ] && grep -q "Automatic Analysis is enabled" target/sonarcloud.log; then
            echo "SonarCloud Automatic Analysis is enabled for this project; skipping CI-based upload."
            exit 0
          fi
          exit "${status}"
      - name: SonarCloud Skip Notice
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN is not configured; skipping SonarCloud upload."

  release:
    name: Release Jar
    runs-on: ${{ matrix.os }}
    needs: [quality]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build shaded jar
        run: ./mvnw -B -DskipTests package
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: fixdecoder-java-${{ matrix.os }}
          path: target/fixdecoder-java-*.jar
