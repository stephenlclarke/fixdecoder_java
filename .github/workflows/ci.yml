---
# yamllint disable rule:truthy rule:line-length
name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Lint workflow YAML
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install yamllint
          yamllint .github/workflows
      - name: Ensure FIX dictionaries
        run: bash -lc 'source ci/ci_helper.sh && download_fix_specs'
      - name: Verify
        run: ./mvnw -B verify
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: error

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: jacoco-report
          path: target/site/jacoco
      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B -DskipTests sonar:sonar

  release:
    name: Release Jar
    runs-on: ${{ matrix.os }}
    needs: [quality]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build shaded jar
        run: ./mvnw -B -DskipTests package
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: fixdecoder-java-${{ matrix.os }}
          path: target/fixdecoder-java-*.jar
