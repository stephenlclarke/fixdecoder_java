---
# yamllint disable rule:truthy rule:line-length
# SPDX-License-Identifier: AGPL-3.0-only
# SPDX-FileCopyrightText: 2026 Steve Clarke <stephenlclarke@mac.com> - https://xyzzy.tools
name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Lint workflow YAML
        run: |
          python3 -m pip install yamllint==1.37.1
          yamllint .github/workflows
      - name: Ensure FIX dictionaries
        run: bash -lc 'source ci/ci_helper.sh && download_fix_specs'
      - name: Verify
        run: ./mvnw -B verify -Pcoverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: error

  release:
    name: Release Jar
    runs-on: ${{ matrix.os }}
    needs: [quality]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build shaded jar
        run: ./mvnw -B -DskipTests package
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: fixdecoder-java-${{ matrix.os }}
          path: |
            target/fixdecoder-java-*.jar
            scripts/fixdecoder
